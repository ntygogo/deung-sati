<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>

    <!-- Soft Aura Blue/Pink Glow -->
    <radialGradient id="coupleGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#fef3c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>

    <!-- Boy Sweater Gradient (Soft Pastel Blue) -->
    <linearGradient id="boySweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Girl Sweater Gradient (Soft Pastel Pink/Rose) -->
    <linearGradient id="girlSweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Hair Gradients -->
    <linearGradient id="boyHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b32" />
      <stop offset="100%" stop-color="#2d2118" />
    </linearGradient>

    <linearGradient id="girlHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c4a38" />
      <stop offset="100%" stop-color="#432c21" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Soft Romantic Aura Backdrop -->
  <circle cx="200" cy="155" r="125" fill="url(#coupleGlow)" />

  <!-- Floating Sparkles & Soft Petals -->
  <!-- Top Stars -->
  <path d="M120 70 Q122 80 130 82 Q122 84 120 94 Q118 84 110 82 Q118 80 120 70 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M280 65 Q282 73 288 75 Q282 77 280 85 Q278 77 272 75 Q278 73 280 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M195 45 Q197 53 203 55 Q197 57 195 65 Q193 57 187 55 Q193 53 195 45 Z" fill="#f472b6" opacity="0.6" />

  <!-- Soft Floating Petals -->
  <ellipse cx="90" cy="140" rx="8" ry="4" transform="rotate(-30 90 140)" fill="#fda4af" opacity="0.6" />
  <ellipse cx="315" cy="130" rx="7" ry="4" transform="rotate(25 315 130)" fill="#93c5fd" opacity="0.6" />
  <ellipse cx="140" cy="230" rx="9" ry="5" transform="rotate(15 140 230)" fill="#fbcfe8" opacity="0.5" />
  <ellipse cx="270" cy="225" rx="8" ry="4" transform="rotate(-20 270 225)" fill="#bfdbfe" opacity="0.5" />

  <!-- Little Soft Floating Glowing Heart -->
  <g transform="translate(192, 75) scale(0.9)" filter="url(#softGlow)">
    <path d="M10 3.5 C10 0, 5 -2, 0 3 C-5 -2, -10 0, -10 3.5 C-10 8, 0 14, 0 16 C0 14, 10 8, 10 3.5 Z" fill="#f43f5e" opacity="0.85" />
  </g>

  <!-- === COUPLE HUGGING ILUSTRATION === -->
  <g transform="translate(0, 10)">
    
    <!-- 1. Girl Long Flowing Hair (Back layer) -->
    <path d="M210 135 C235 150 250 190 240 240 C230 220 225 180 215 160 Z" fill="url(#girlHair)" />
    
    <!-- 2. Boy Body & Left Shoulder (Pastel Blue) -->
    <path d="M125 260 C130 195 155 160 185 155 C195 155 195 175 185 195 C170 220 160 250 155 260 Z" fill="url(#boySweater)" />
    <path d="M125 260 C135 200 160 170 195 170 C190 200 185 240 180 260 Z" fill="url(#boySweater)" />

    <!-- 3. Girl Body & Right Shoulder (Pastel Rose Pink) -->
    <path d="M275 260 C270 195 245 160 215 155 C205 155 205 175 215 195 C230 220 240 250 245 260 Z" fill="url(#girlSweater)" />
    <path d="M275 260 C265 200 240 170 205 170 C210 200 215 240 220 260 Z" fill="url(#girlSweater)" />

    <!-- 4. Boy Head & Hair -->
    <!-- Boy Neck & Face -->
    <circle cx="172" cy="130" r="28" fill="#fde6d2" />
    <path d="M185 130 C185 145 170 155 160 148 C155 140 155 130 165 122 Z" fill="#fbd3b6" />
    <!-- Boy Hair -->
    <path d="M144 125 C142 105 155 90 178 92 C198 94 204 110 202 124 C195 115 188 114 175 116 C165 117 155 120 144 125 Z" fill="url(#boyHair)" />
    <!-- Boy Gentle Closed Eye (Peaceful smile) -->
    <path d="M165 128 Q172 133 178 129" stroke="#5c4033" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Boy Soft Rosy Cheek -->
    <ellipse cx="163" cy="137" rx="5" ry="3" fill="#fca5a5" opacity="0.6" />

    <!-- 5. Girl Head & Hair (Resting gently on boy's shoulder) -->
    <!-- Girl Head -->
    <circle cx="225" cy="132" r="27" fill="#fde8d7" />
    <!-- Girl Hair Top & Bangs -->
    <path d="M202 126 C202 105 215 90 238 92 C258 94 264 112 260 130 C250 115 240 114 225 116 C215 117 208 120 202 126 Z" fill="url(#girlHair)" />
    <!-- Girl Hair side falling -->
    <path d="M245 125 C255 145 258 175 250 205 C242 180 240 150 238 135 Z" fill="url(#girlHair)" />
    <!-- Girl Gentle Closed Eye -->
    <path d="M218 130 Q225 135 231 131" stroke="#5c4033" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Girl Soft Rosy Cheek -->
    <ellipse cx="230" cy="138" rx="5" ry="3" fill="#f472b6" opacity="0.65" />
    <!-- Girl Sweet Gentle Smile -->
    <path d="M220 145 Q224 148 228 145" stroke="#be185d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- 6. Boy's Arm Embracing Girl (Pastel Blue) -->
    <path d="M140 200 C150 215 180 230 225 215 C235 210 242 195 240 190 C238 185 228 190 220 195 C185 210 160 195 150 185 Z" fill="url(#boySweater)" />
    <!-- Boy's Hand gently on Girl's back -->
    <path d="M232 190 C238 188 245 192 244 198 C242 205 235 208 228 205 Z" fill="#fde6d2" />

    <!-- 7. Girl's Arm Embracing Boy (Pastel Pink) -->
    <path d="M260 200 C250 215 220 230 175 215 C165 210 158 195 160 190 C162 185 172 190 180 195 C215 210 240 195 250 185 Z" fill="url(#girlSweater)" />
    <!-- Girl's Hand gently on Boy's back -->
    <path d="M168 190 C162 188 155 192 156 198 C158 205 165 208 172 205 Z" fill="#fde8d7" />

  </g>
</svg>
