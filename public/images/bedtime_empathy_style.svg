<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bedBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="bedAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bedBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#bedAura)" />
  
  <!-- Floating Night Stars -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#fbbf24" opacity="0.8" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#818cf8" opacity="0.8" />

  <!-- === SLEEPY CRESCENT MOON & COZY BEDTIME SAFE === -->
  <g transform="translate(200, 140)">
    <!-- Sleepy Crescent Moon -->
    <g transform="translate(-35, -20)">
      <path d="M15 -45 C-25 -45 -55 -15 -55 25 C-55 65 -25 95 15 95 C-10 75 -20 45 -20 25 C-20 5 -10 -25 15 -45 Z" fill="#fde68a" stroke="#d97706" stroke-width="2.5" />
      <!-- Sleeping Closed Eye & Smile -->
      <path d="M-38 20 Q-32 26 -26 20" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M-36 30 Q-30 34 -24 30" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <ellipse cx="-40" cy="26" rx="4" ry="2.5" fill="#fca5a5" opacity="0.75" />
    </g>

    <!-- Bedtime Wooden Vault Box (Right Side) -->
    <g transform="translate(40, 20)">
      <rect x="-35" y="-20" width="70" height="50" rx="8" fill="#fed7aa" stroke="#9a3412" stroke-width="2.5" />
      <rect x="-38" y="-28" width="76" height="12" rx="4" fill="#fb923c" stroke="#9a3412" stroke-width="2" />
      <!-- Golden Keyhole / Lock -->
      <circle cx="0" cy="4" r="9" fill="#fde68a" stroke="#b45309" stroke-width="2" />
      <circle cx="0" cy="2" r="3" fill="#78350f" />
      <path d="M0 2 L0 8" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Floating Zzz Sleep Letters -->
    <g fill="#6366f1" font-family="sans-serif" font-weight="bold">
      <text x="-5" y="-55" font-size="14" opacity="0.8">z</text>
      <text x="12" y="-70" font-size="18" opacity="0.9">Z</text>
      <text x="32" y="-88" font-size="22" opacity="1">Z</text>
    </g>
  </g>
</svg>
