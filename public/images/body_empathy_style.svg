<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="bodyAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fce7f3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bodyBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#bodyAura)" />
  
  <!-- Floating Sparkles -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#f43f5e" opacity="0.7" />

  <!-- === GENTLE HANDS OVER GLOWING HEART === -->
  <g transform="translate(200, 145)">
    <!-- Glowing Heart Center -->
    <g transform="scale(1.3)">
      <path d="M0 -10 C-18 -35 -45 -10 -25 15 C-10 32 0 42 0 42 C0 42 10 32 25 15 C45 -10 18 -35 0 -10 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2.5" />
      <circle cx="0" cy="5" r="16" fill="#ffffff" opacity="0.4" />
    </g>

    <!-- Left Gentle Hand -->
    <g transform="translate(-40, 5) rotate(-15)">
      <path d="M-25 10 C-15 -5 10 -8 30 5 C35 15 25 25 10 25 C-5 25 -20 20 -25 10 Z" fill="#fde6d2" stroke="#e11d48" stroke-width="2" />
      <path d="M25 5 C30 8 32 14 28 18" stroke="#e11d48" stroke-width="2" fill="none" />
    </g>

    <!-- Right Gentle Hand -->
    <g transform="translate(40, 5) rotate(15)">
      <path d="M25 10 C15 -5 -10 -8 -30 5 C-35 15 -25 25 -10 25 C5 25 20 20 25 10 Z" fill="#fde6d2" stroke="#e11d48" stroke-width="2" />
      <path d="M-25 5 C-30 8 -32 14 -28 18" stroke="#e11d48" stroke-width="2" fill="none" />
    </g>

    <!-- Soft Golden Radiance Rays -->
    <path d="M0 -55 L0 -70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <path d="M-45 -40 L-55 -50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M45 -40 L55 -50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
