<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matches couple_empathy exactly) -->
    <radialGradient id="mirrorBgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>

    <!-- Soft Aura Warm/Amber Glow -->
    <radialGradient id="mirrorAuraGlow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#fee2e2" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#e0e7ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Mirror Frame Gradient -->
    <linearGradient id="goldFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Mirror Glass Pastel Reflection -->
    <linearGradient id="glassReflectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>

    <!-- Cute Pastel Devil Spirit (Warm Terracotta/Coral) -->
    <linearGradient id="devilBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Soft Wing Gradient -->
    <linearGradient id="devilWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="softGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" rx="16" fill="url(#mirrorBgGrad)" />

  <!-- Soft Romantic Aura Backdrop -->
  <circle cx="200" cy="150" r="125" fill="url(#mirrorAuraGlow)" />

  <!-- Floating Sparkles & Soft Petals -->
  <!-- Top Stars -->
  <path d="M110 65 Q112 75 120 77 Q112 79 110 89 Q108 79 100 77 Q108 75 110 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M290 60 Q292 68 298 70 Q292 72 290 80 Q288 72 282 70 Q288 68 290 60 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M195 40 Q197 48 203 50 Q197 52 195 60 Q193 52 187 50 Q193 48 195 40 Z" fill="#f472b6" opacity="0.6" />

  <!-- Soft Floating Petals -->
  <ellipse cx="85" cy="135" rx="8" ry="4" transform="rotate(-30 85 135)" fill="#fda4af" opacity="0.6" />
  <ellipse cx="320" cy="125" rx="7" ry="4" transform="rotate(25 320 125)" fill="#93c5fd" opacity="0.6" />
  <ellipse cx="130" cy="235" rx="9" ry="5" transform="rotate(15 130 235)" fill="#fbcfe8" opacity="0.5" />
  <ellipse cx="280" cy="230" rx="8" ry="4" transform="rotate(-20 280 230)" fill="#bfdbfe" opacity="0.5" />

  <!-- === CLEAN ELEGANT MAGIC MIRROR === -->
  <g transform="translate(195, 145)">
    <!-- Mirror Stand Base & Legs -->
    <path d="M-40 95 C-20 85 20 85 40 95 C25 102 -25 102 -40 95 Z" fill="url(#goldFrameGrad)" />
    <path d="M-6 80 L-10 95 L10 95 L6 80 Z" fill="url(#goldFrameGrad)" />

    <!-- Outer Golden Frame Ring with Soft Glow -->
    <ellipse cx="0" cy="-5" rx="66" ry="86" fill="url(#goldFrameGrad)" filter="url(#softGlowFilter)" opacity="0.4" />
    <ellipse cx="0" cy="-5" rx="64" ry="84" fill="url(#goldFrameGrad)" />

    <!-- Top Crown Ornament -->
    <path d="M0 -96 C-12 -96 -18 -84 0 -76 C18 -84 12 -96 0 -96 Z" fill="#fde68a" />
    <circle cx="0" cy="-86" r="4.5" fill="#f59e0b" />
    
    <!-- Left & Right Frame Carvings -->
    <circle cx="-62" cy="-5" r="4.5" fill="#fde68a" />
    <circle cx="62" cy="-5" r="4.5" fill="#fde68a" />

    <!-- Inner Golden Bezel -->
    <ellipse cx="0" cy="-5" rx="55" ry="75" fill="#d97706" />
    <ellipse cx="0" cy="-5" rx="52" ry="72" fill="#fffbeb" />

    <!-- Glass Reflection Surface (Pastel sky blue with stardust reflection) -->
    <ellipse cx="0" cy="-5" rx="50" ry="70" fill="url(#glassReflectionGrad)" />

    <!-- Starlight inside the mirror reflection -->
    <g opacity="0.85">
      <path d="M-18 -25 Q-16 -18 -10 -16 Q-16 -14 -18 -7 Q-20 -14 -26 -16 Q-20 -18 -18 -25 Z" fill="#ffffff" />
      <path d="M15 15 Q17 21 23 23 Q17 25 15 31 Q13 25 7 23 Q13 21 15 15 Z" fill="#ffffff" />
      <circle cx="12" cy="-30" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="-20" cy="25" r="2.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Glossy Diagonal Light Sweep across mirror glass -->
    <path d="M-30 -55 C-10 -70 20 -40 -35 45 C-45 30 -45 -30 -30 -55 Z" fill="#ffffff" opacity="0.35" />

    <!-- === CUTE LITTLE FRIENDLY REFLECTION SPIRIT (DEVIL) === -->
    <!-- Positioned cheerfully on the top right edge of the mirror -->
    <g transform="translate(48, -62) scale(0.95)">
      <!-- Little Wings (Soft coral pink) -->
      <path d="M12 -2 C26 -16 32 4 18 10 C14 6 10 3 12 -2 Z" fill="url(#devilWingGrad)" opacity="0.9" />
      <path d="M-10 6 C-24 -4 -26 14 -12 16 C-8 12 -6 8 -10 6 Z" fill="url(#devilWingGrad)" opacity="0.9" />

      <!-- Cute Round Body & Head -->
      <circle cx="4" cy="4" r="16" fill="url(#devilBodyGrad)" />

      <!-- Little Horns -->
      <path d="M-4 -9 Q-8 -18 -2 -17 Q-1 -12 -2 -8 Z" fill="#b91c1c" />
      <path d="M10 -9 Q16 -18 10 -17 Q8 -12 8 -8 Z" fill="#b91c1c" />

      <!-- Soft Rosy Cheeks -->
      <ellipse cx="-2" cy="7" rx="3.5" ry="2" fill="#fca5a5" opacity="0.75" />
      <ellipse cx="10" cy="7" rx="3.5" ry="2" fill="#fca5a5" opacity="0.75" />

      <!-- Sweet Happy Closed Eyes -->
      <path d="M-5 3 Q-2 6 1 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M7 3 Q10 6 13 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Sweet Little Smile -->
      <path d="M2 9 Q4 12 6 9" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />

      <!-- Tiny Friendly Waving Arm -->
      <path d="M18 2 C22 -4 26 -2 24 6 C20 8 18 6 18 2 Z" fill="#f87171" />
    </g>
  </g>
</svg>
