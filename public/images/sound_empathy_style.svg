<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="soundBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="soundAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#soundBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#soundAura)" />
  
  <!-- Floating Sparkles -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#6366f1" opacity="0.7" />

  <!-- === TIBETAN SINGING BOWL & RESONANT SOUNDWAVES === -->
  <g transform="translate(200, 145)">
    <!-- Harmonic Resonant Sound Wave Rings -->
    <ellipse cx="0" cy="-20" rx="90" ry="30" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.5" />
    <ellipse cx="0" cy="-20" rx="70" ry="22" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.7" />
    <ellipse cx="0" cy="-20" rx="50" ry="15" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.9" />

    <!-- Tibetan Singing Bowl Body -->
    <g transform="translate(0, 10)">
      <!-- Bowl Base Cushion -->
      <ellipse cx="0" cy="45" rx="35" ry="12" fill="#fda4af" stroke="#e11d48" stroke-width="2" />
      <!-- Golden Brass Bowl -->
      <path d="M-55 -15 C-55 40 55 40 55 -15 C45 -22 -45 -22 -55 -15 Z" fill="#fde68a" stroke="#b45309" stroke-width="3" />
      <ellipse cx="0" cy="-15" rx="55" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2.5" />
      <ellipse cx="0" cy="-15" rx="50" ry="11" fill="#fef08a" />
      
      <!-- Wooden Striker / Mallet Resting at Side -->
      <g transform="translate(38, -35) rotate(28)">
        <rect x="-6" y="-30" width="12" height="60" rx="6" fill="#b45309" stroke="#78350f" stroke-width="2" />
        <rect x="-6" y="10" width="12" height="20" rx="3" fill="#fca5a5" />
      </g>
    </g>

    <!-- Floating Sound Notes & Music Stars -->
    <g fill="#d97706">
      <path d="M-45 -55 L-45 -70 L-25 -65 L-25 -50" stroke="#d97706" stroke-width="2" fill="none" />
      <circle cx="-45" cy="-55" r="4" />
      <circle cx="-25" cy="-50" r="4" />
      <path d="M35 -65 L35 -80 L55 -75 L55 -60" stroke="#d97706" stroke-width="2" fill="none" />
      <circle cx="35" cy="-65" r="4" />
      <circle cx="55" cy="-60" r="4" />
    </g>
  </g>
</svg>
