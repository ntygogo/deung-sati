<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="libBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="libAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#fee2e2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#libBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#libAura)" />
  
  <!-- Floating Sparkles -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#b45309" opacity="0.7" />

  <!-- === OPEN STORYBOOK & GLOWING WISDOM STARS === -->
  <g transform="translate(200, 145)">
    <!-- Open Book Cover Base -->
    <path d="M0 35 C-30 25 -70 30 -85 45 L-85 -20 C-70 -35 -30 -40 0 -30 C30 -40 70 -35 85 -20 L85 45 C70 30 30 25 0 35 Z" fill="#b45309" stroke="#78350f" stroke-width="3" />
    
    <!-- Open Pages (Warm Cream Color) -->
    <!-- Left Page -->
    <path d="M-5 30 C-30 20 -65 24 -78 35 L-78 -24 C-65 -35 -30 -30 -5 -22 Z" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <!-- Right Page -->
    <path d="M5 30 C30 20 65 24 78 35 L78 -24 C65 -35 30 -30 5 -22 Z" fill="#ffffff" stroke="#b45309" stroke-width="2" />

    <!-- Text Lines on Pages -->
    <!-- Left Page Lines -->
    <path d="M-65 -10 L-20 -10 M-65 2 L-20 2 M-65 14 L-35 14" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Right Page Lines -->
    <path d="M20 -10 L65 -10 M20 2 L65 2 M20 14 L45 14" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Golden Bookmark Ribbon Hanging Down -->
    <path d="M0 -25 L0 52 L6 46 L12 52 L12 -25 Z" fill="#ef4444" />

    <!-- Magic Glowing Wisdom Stars & Hearts Rising from Book -->
    <g transform="translate(0, -45)">
      <path d="M0 -15 Q2 -8 8 -6 Q2 -4 0 3 Q-2 -4 -8 -6 Q-2 -8 0 -15 Z" fill="#f59e0b" />
      <path d="M-22 -8 Q-20 -4 -16 -3 Q-20 -2 -22 2 Q-24 -2 -28 -3 Q-24 -4 -22 -8 Z" fill="#fbbf24" />
      <path d="M22 -6 Q24 -2 28 -1 Q24 0 22 4 Q20 0 16 -1 Q20 -2 22 -6 Z" fill="#fbbf24" />
      <!-- Soft Little Heart -->
      <path d="M0 -30 C-3 -34, -7 -32, -7 -28 C-7 -24, 0 -20, 0 -19 C0 -20, 7 -24, 7 -28 C7 -32, 3 -34, 0 -30 Z" fill="#f43f5e" opacity="0.85" />
    </g>
  </g>
</svg>
