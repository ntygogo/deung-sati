<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="breathBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="breathAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ccfbf1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#breathBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#breathAura)" />
  
  <!-- Floating Sparkles -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#38bdf8" opacity="0.75" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#2dd4bf" opacity="0.7" />

  <!-- === CUTE GENTLE BREATHING CLOUD & SOOTHING WIND === -->
  <g transform="translate(200, 145)">
    <!-- Concentric Soft Breath Expansion Rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.4" />

    <!-- Cute Breathing Cloud Character -->
    <g transform="translate(0, -10)">
      <!-- Cloud Body -->
      <path d="M-45 25 C-60 25 -65 5 -50 -10 C-60 -30 -35 -45 -15 -35 C0 -50 30 -45 40 -25 C60 -25 65 0 50 20 C60 35 40 45 20 40 C5 48 -30 45 -45 25 Z" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
      <!-- Cloud Cute Face -->
      <!-- Closed Peaceful Eyes -->
      <path d="M-22 0 Q-15 6 -8 0" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M8 0 Q15 6 22 0" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Rosy Cheeks -->
      <ellipse cx="-20" cy="8" rx="6" ry="3.5" fill="#fca5a5" opacity="0.8" />
      <ellipse cx="20" cy="8" rx="6" ry="3.5" fill="#fca5a5" opacity="0.8" />
      <!-- Cute Breathing Mouth -->
      <circle cx="0" cy="10" r="5" fill="#0284c7" />
      <circle cx="0" cy="10" r="3.5" fill="#e0f2fe" />
    </g>

    <!-- Flowing Soothing Wind Swirls (Inhale & Exhale) -->
    <g transform="translate(0, 45)">
      <path d="M-80 5 C-40 -15 0 15 50 -5 C70 -12 80 0 65 10 C50 20 30 10 40 0" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M-50 22 C-20 8 20 28 60 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Floating Water Lotus at Bottom Center -->
    <g transform="translate(0, 75) scale(0.8)">
      <ellipse cx="-16" cy="0" rx="14" ry="6" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5" />
      <ellipse cx="16" cy="0" rx="14" ry="6" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5" />
      <ellipse cx="0" cy="-6" rx="10" ry="14" fill="#f472b6" stroke="#db2777" stroke-width="1.5" />
    </g>
  </g>
</svg>
