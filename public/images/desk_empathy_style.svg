<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="deskBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="deskAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fef3c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#deskBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#deskAura)" />
  
  <!-- Floating Sparkles -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#fb923c" opacity="0.7" />

  <!-- === COZY DESK SOMATIC SCENE === -->
  <g transform="translate(200, 150)">
    <!-- Wooden Desk Surface -->
    <path d="M-130 50 L130 50" stroke="#b45309" stroke-width="5" stroke-linecap="round" />

    <!-- Cute Steaming Coffee / Tea Mug (Center) -->
    <g transform="translate(-25, 10)">
      <!-- Mug Body -->
      <rect x="-24" y="-15" width="48" height="40" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5" />
      <!-- Mug Handle -->
      <path d="M24 -5 C36 -5 36 20 24 20" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
      <!-- Coffee Face -->
      <ellipse cx="-7" cy="8" rx="2.5" ry="1.5" fill="#f87171" />
      <ellipse cx="7" cy="8" rx="2.5" ry="1.5" fill="#f87171" />
      <path d="M-4 5 Q0 8 4 5" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <circle cx="-7" cy="1" r="2" fill="#78350f" />
      <circle cx="7" cy="1" r="2" fill="#78350f" />
      <!-- Aromatic Warm Steam Waves -->
      <path d="M-8 -22 Q-12 -34 -4 -42" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M0 -24 Q-4 -38 6 -48" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
      <path d="M8 -22 Q12 -34 4 -42" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Cute Potted Plant (Right side) -->
    <g transform="translate(65, 15)">
      <!-- Pot -->
      <path d="M-16 0 L16 0 L12 35 L-12 35 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5" />
      <!-- Green Leaves -->
      <ellipse cx="0" cy="-12" rx="14" ry="18" fill="#34d399" stroke="#059669" stroke-width="2" />
      <ellipse cx="-12" cy="-6" rx="10" ry="14" transform="rotate(-30 -12 -6)" fill="#6ee7b7" stroke="#059669" stroke-width="2" />
      <ellipse cx="12" cy="-6" rx="10" ry="14" transform="rotate(30 12 -6)" fill="#6ee7b7" stroke="#059669" stroke-width="2" />
      <!-- Plant Happy Eyes -->
      <circle cx="-4" cy="15" r="2" fill="#78350f" />
      <circle cx="4" cy="15" r="2" fill="#78350f" />
      <path d="M-2 22 Q0 24 2 22" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- 60-Second Refresh Timer Aura Badge -->
    <g transform="translate(-75, -20)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" />
      <!-- Clock Hands -->
      <path d="M0 0 L0 -12" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
      <path d="M0 0 L8 4" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#d97706" />
      <!-- Text 60s -->
      <text x="0" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">60s Reset</text>
    </g>
  </g>
</svg>
