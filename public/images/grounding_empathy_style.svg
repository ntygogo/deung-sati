<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="groundBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="60%" stop-color="#faeee4" />
      <stop offset="100%" stop-color="#f5e4d5" />
    </radialGradient>
    <radialGradient id="groundAura" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fef3c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fff8f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#groundBg)" />
  <circle cx="200" cy="150" r="125" fill="url(#groundAura)" />
  
  <!-- Floating Sparkles -->
  <path d="M100 65 Q102 75 110 77 Q102 79 100 89 Q98 79 90 77 Q98 75 100 65 Z" fill="#fbbf24" opacity="0.75" />
  <path d="M300 60 Q302 68 308 70 Q302 72 300 80 Q298 72 292 70 Q298 68 300 60 Z" fill="#10b981" opacity="0.7" />

  <!-- === GROUNDING COMPASS & 5-SENSES STARBURST === -->
  <g transform="translate(200, 145)">
    <!-- Golden Compass Ring -->
    <circle cx="0" cy="0" r="75" fill="#ffffff" stroke="#10b981" stroke-width="3" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="3 5" />

    <!-- Center Grounding Tree / Sprout -->
    <path d="M0 45 L0 5" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="-16" cy="-5" rx="16" ry="10" transform="rotate(-30 -16 -5)" fill="#34d399" stroke="#059669" stroke-width="2" />
    <ellipse cx="16" cy="-5" rx="16" ry="10" transform="rotate(30 16 -5)" fill="#34d399" stroke="#059669" stroke-width="2" />
    <circle cx="0" cy="-18" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="2" />

    <!-- 5 Senses Floating Orbs Around Compass -->
    <!-- 1. Eye (Sight) -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <path d="M-8 0 Q0 -6 8 0 Q0 6 -8 0 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3" fill="#0284c7" />
    </g>
    <!-- 2. Hand (Touch) -->
    <g transform="translate(48, -15)">
      <circle cx="0" cy="0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <text x="0" y="4" font-size="12" text-anchor="middle">✋</text>
    </g>
    <!-- 3. Ear/Sound (Hearing) -->
    <g transform="translate(30, 40)">
      <circle cx="0" cy="0" r="14" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" />
      <text x="0" y="4" font-size="12" text-anchor="middle">👂</text>
    </g>
    <!-- 4. Flower (Smell) -->
    <g transform="translate(-30, 40)">
      <circle cx="0" cy="0" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
      <text x="0" y="4" font-size="12" text-anchor="middle">🌸</text>
    </g>
    <!-- 5. Lips/Tea (Taste) -->
    <g transform="translate(-48, -15)">
      <circle cx="0" cy="0" r="14" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
      <text x="0" y="4" font-size="12" text-anchor="middle">☕</text>
    </g>
  </g>
</svg>
