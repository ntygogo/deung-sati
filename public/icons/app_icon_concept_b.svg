<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="60%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Warm Cup Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(254, 243, 199, 0.8)" />
      <stop offset="100%" stop-color="rgba(254, 243, 199, 0.1)" />
    </linearGradient>

    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradB)" />
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Outer Aura Glow -->
  <circle cx="256" cy="280" r="140" fill="rgba(251, 191, 36, 0.1)" filter="url(#glowB)" />

  <!-- Calming Mindful Steam (Curves forming an awakening spark) -->
  <path d="M 220 220 C 200 170 240 140 256 110 C 272 140 312 170 292 220" fill="none" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 256 200 C 248 165 264 145 256 125" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-linecap="round" opacity="0.9" />

  <!-- Spark of Awareness in the Steam -->
  <g filter="url(#glowB)">
    <path d="M 256 80 Q 256 100 240 100 Q 256 100 256 120 Q 256 100 272 100 Q 256 100 256 80 Z" fill="#FDE68A" />
    <circle cx="256" cy="100" r="6" fill="#FFFFFF" />
  </g>

  <!-- Minimalist Cozy Ceramic Cup -->
  <g filter="url(#glowB)">
    <!-- Cup Body -->
    <path d="M 170 240 L 342 240 C 336 330 300 365 256 365 C 212 365 176 330 170 240 Z" fill="url(#cupGrad)" />
    <!-- Cup Handle -->
    <path d="M 335 260 C 375 260 385 310 330 325" fill="none" stroke="url(#cupGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Little Heart/Smile on Cup -->
    <circle cx="256" cy="295" r="8" fill="#D97706" />
    <!-- Saucer / Base Plate -->
    <rect x="140" y="375" width="232" height="18" rx="9" fill="url(#cupGrad)" opacity="0.9" />
  </g>
</svg>
