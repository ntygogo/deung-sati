<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Beacon Light Gradient -->
    <linearGradient id="beaconLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradC)" />
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Radiating Awareness Waves (คลื่นสติที่แผ่ออก) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(234, 179, 8, 0.12)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(234, 179, 8, 0.2)" stroke-width="3" />

  <!-- Glassmorphic Mirror Shield (กระจกส่องความจริง) -->
  <rect x="146" y="146" width="220" height="220" rx="60" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="4" filter="url(#glowC)" />
  <!-- Mirror Reflection diagonal highlight -->
  <path d="M 170 150 L 320 150 L 150 320 L 150 170 Z" fill="url(#glassReflection)" />

  <!-- Warm Golden Beacon Lamp & Spark in the Center -->
  <g filter="url(#glowC)">
    <!-- Golden Core Light -->
    <circle cx="256" cy="256" r="48" fill="url(#beaconLight)" />
    <circle cx="256" cy="256" r="28" fill="#FFFBEB" />

    <!-- 4 Mindful Beams (ส่องสว่าง 4 ทิศทาง) -->
    <path d="M 256 160 L 256 195" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
    <path d="M 256 317 L 256 352" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
    <path d="M 160 256 L 195 256" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
    <path d="M 317 256 L 352 256" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
