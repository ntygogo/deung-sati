name: Web billing sandbox
on:
  pull_request:
    paths: ['server/**', 'api/**', 'src/**', 'package*.json', 'vercel.json', '.github/workflows/web-billing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing_fixture
          POSTGRES_PASSWORD: fixture_only_not_a_real_secret
          POSTGRES_DB: billing_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:beta
      - run: npm run test:billing
      - run: npm run test:billing
        env:
          BILLING_TEST_DATABASE_URL: postgresql://billing_fixture:fixture_only_not_a_real_secret@localhost:5432/billing_fixture
